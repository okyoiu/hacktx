[project]
name = "hello-again"
version = "0.1.0"
description = "Private call overlay that remembers the people you meet (HackTX 26)"
requires-python = ">=3.11,<3.13"
dependencies = [
  # memory service (Person B)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "openai>=1.40",
  # capture (Person A)
  "ultralytics>=8.4",
  "insightface>=0.7.3",
  "onnxruntime>=1.18",
  "opencv-python>=4.9",
  "mss>=9.0",
  "sounddevice>=0.4",
  "websockets>=12",
  "lap>=0.5.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
